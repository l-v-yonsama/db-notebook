name: CI

on:
  push:
  pull_request:

jobs:
  extension-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile (tsc)
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run
