<!DOCTYPE html>
<html data-theme="light" data-report-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Database Notebook Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Restore before styles load to avoid flashing the default palette.
      (function () {
        const storageKey = "db-notebook.report.theme";
        const themes = ["light", "warm", "slate", "sage", "midnight", "chalkboard", "patisserie", "roastery"];
        const root = document.documentElement;
        const applyTheme = (theme) => {
          root.dataset.reportTheme = themes.includes(theme) ? theme : "light";
          root.dataset.theme = ["midnight", "chalkboard", "roastery"].includes(root.dataset.reportTheme)
            ? "dark"
            : "light";
        };
        try {
          applyTheme(localStorage.getItem(storageKey));
        } catch (e) {
          // Local files and browsers that block storage can still switch themes.
        }
        document.addEventListener("DOMContentLoaded", function () {
          const select = document.getElementById("report-theme");
          const logo = document.getElementById("report-theme-logo");
          const updateLogo = () => {
            logo.onerror = () => {
              logo.onerror = null;
              logo.src = "https://l-v-yonsama.github.io/db-notebook/media/logo128.png";
            };
            logo.src = `https://l-v-yonsama.github.io/db-notebook/media/theme-logos/logo-${root.dataset.reportTheme}.png`;
          };
          select.value = root.dataset.reportTheme;
          updateLogo();
          select.addEventListener("change", function () {
            applyTheme(select.value);
            updateLogo();
            document.dispatchEvent(new Event("report-theme-change"));
            try {
              localStorage.setItem(storageKey, root.dataset.reportTheme);
            } catch (e) {
              // Remembering the choice is optional; applying it is not.
            }
          });
        });
      })();
    </script>

      .report-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1rem;
        margin-bottom: 1rem;
      }
      .report-toolbar .report-search {
        flex: 1 1 28rem;
        min-width: 0;
        margin-bottom: 0;
      }
      .report-theme-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .ellipsis {
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
      }

        margin-left: 5px;
        margin-right: 5px;
        min-width: 90px;
        text-align: center;
      }

      div.chart {
        color: var(--bulma-text-weak);
        background-color: var(--bulma-scheme-main);
      }

      div.block {
        position: relative;
      }

      /* Keep any long code/result block usable in a resized report window. */
      pre {
        max-height: 80vh;
        overflow-x: auto;
        overflow-y: auto;
      }

      /* DBMS_XPLAN and similar native plans use spaces to form columns.
         Restrict this to the dedicated Markdown fence so normal report text
         and regular SQL/JSON code blocks retain their existing appearance. */
      pre.actual-execution-plan,
      pre.actual-execution-plan code {
        font-family: var(--report-code-family, ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace);
        font-variant-ligatures: none;
        white-space: pre;
        font-size: var(--report-code-size, small);
        line-height: 1.25;
      }

      span.tag.contains {
        position: absolute;
        right: 10px;
        top: 1px;
      }

      span.tag.is-light {
        color: var(--bulma-text-weak);
      }

      .pair-plot-chart {
        overflow-y: auto;
      }
      .pair-plot-chart p.title {
        text-align: center;
        margin: 2px 0;
      }
      .pair-plot-chart .legends {
        text-align: center;
        margin-bottom: 1px;
      }
      .pair-plot-chart .legends div.legend {
        display: inline-block;
        min-width: 3em;
        padding: 0px 5px;
        margin-right: 2em;
        border-width: 2px;
        border-style: solid;
        line-height: 1.2;
      }

      .pair-plot-chart table {
        table-layout: fixed;
        width: 100%;
        margin: 1px;
      }

      .pair-plot-chart th {
        font-weight: normal;
        background-color: var(--bulma-background);
        text-align: center;
        color: var(--bulma-text-weak);
      }
      .pair-plot-chart th.rl {
        width: 1.7em;
        text-align: center;
      }
      .pair-plot-chart th div.rl {
        line-height: 0.9em;
        width: 1.7em;
        text-align: center;
        white-space: pre-line;
        overflow: hidden;
        writing-mode: vertical-rl;
      }
      .pair-plot-chart td {
        vertical-align: middle;
        border: 1px dotted var(--bulma-border);
        text-align: center;
      }
      .pair-plot-chart td .very_weak {
        color: #999;
        font-size: small;
      }
      .pair-plot-chart td .weak {
        color: #666;
      }
      .pair-plot-chart td .moderate {
        color: #333;
        font-size: large;
      }
      .pair-plot-chart td .strong {
        color: #511;
        font-size: x-large;
      }
      .pair-plot-chart td .very_strong {
        color: #822;
        font-size: xx-large;
      }
      .pair-plot-chart .correlation {
        text-align: center;
      }

      .pagetop {
        height: 50px;
        width: 50px;
        position: fixed;
        right: 30px;
        bottom: 30px;
        background: var(--bulma-scheme-main);
        border: solid 2px var(--bulma-text-strong);
        border-radius: 50%;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2;
        cursor: pointer;
      }
      .pagetop__arrow {
        display: block;
        height: 10px;
        width: 10px;
        border-top: 3px solid var(--bulma-text-strong);
        border-right: 3px solid var(--bulma-text-strong);
        transform: translateY(20%) rotate(-45deg);

        margin-top: 1px;

      }

      div.compact table.table tr td:nth-of-type(1) {
        text-wrap: nowrap;

      button.clipboard {
        position: absolute;
        top: 0px;
        right: 2px;
        padding-top: 0px;
        padding-bottom: 0px;

      div.request,
      div.response {
        margin-left: 15px;
      }

        overflow-y: auto;

        font-weight: normal;

    </style>
    <script>
      <!--
      function unescapeHtml(s) {
        const entityMap = {
          "&amp;": "&",
          "&lt;": "<",
          "&gt;": ">",
          "&quot;": '"',
          "&#39;": "'",
          "&#x60;": "`",
        };
        return s.replace(/&(amp|lt|gt|quot|#39|#x60);/g, (match) => entityMap[match]);
      }

      function escapeHtmlText(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      const reportMermaidSources = [];
      let reportMermaidRender = Promise.resolve();

      function refreshMermaidDiagrams() {
        if (!window.mermaid || reportMermaidSources.length === 0) {
          return;
        }
        // Mermaid replaces each <pre> with an SVG. Recreate the source before
        // rendering so diagrams can follow a later theme change too.
        reportMermaidRender = reportMermaidRender.then(() => {
          for (const { container, source } of reportMermaidSources) {
            const pre = document.createElement("pre");
            pre.className = "mermaid";
            pre.textContent = source;
            container.replaceChildren(pre);
          }
          const dark = document.documentElement.dataset.theme === "dark";
          window.mermaid.initialize({
            startOnLoad: false,
            securityLevel: "strict",
            theme: dark ? "dark" : "default",
            darkMode: dark,
            fontFamily: getComputedStyle(document.body).fontFamily,
          });
          return window.mermaid.run({ querySelector: ".report-mermaid pre.mermaid", suppressErrors: true });
        }).catch((e) => {
          console.warn("Mermaid rendering failed; leaving the source visible.", e);
        });
      }

      function renderMermaidDiagrams() {
        // Mermaid is intentionally not a static dependency: most reports do
        // not contain a diagram. Load the pinned renderer only after Markdown
        // insertion and only when a generated query diagram is present.
        const diagrams = document.querySelectorAll("pre.mermaid");
        if (diagrams.length === 0) {
          return;
        }

        diagrams.forEach((pre) => {
          const container = document.createElement("div");
          container.className = "report-mermaid";
          reportMermaidSources.push({ container, source: pre.textContent });
          pre.replaceWith(container);
          container.appendChild(pre);
        });
        loadScript("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js")
          .then(refreshMermaidDiagrams)
          .catch((e) => {
            console.warn("Mermaid rendering failed; leaving the source visible.", e);
          });
      }

      const reportCharts = [];
      const reportChartDefaults = {
        color: Chart.defaults.color,
        borderColor: Chart.defaults.borderColor,
        fontFamily: Chart.defaults.font.family,
      };

      function refreshChartColors() {
        if (document.documentElement.dataset.reportTheme === "light") {
          Chart.defaults.color = reportChartDefaults.color;
          Chart.defaults.borderColor = reportChartDefaults.borderColor;
          Chart.defaults.font.family = reportChartDefaults.fontFamily;
        } else {
          const styles = getComputedStyle(document.documentElement);
          Chart.defaults.color = styles.getPropertyValue("--bulma-text-weak").trim();
          Chart.defaults.borderColor = styles.getPropertyValue("--bulma-border").trim();
          Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
        }
        reportCharts.forEach((chart) => chart.update("none"));
        if (document.fonts) {
          document.fonts.ready.then(() => reportCharts.forEach((chart) => chart.update("none")));
        }
      }

      document.addEventListener("report-theme-change", () => {
        refreshChartColors();
        refreshMermaidDiagrams();
      });

      $(function () {
        $("button.button.clipboard").click(function () {
          const $this = $(this);
          const data = unescapeHtml($this.data("clip"));
          navigator.clipboard.writeText(data);
        });
        const $pageTop = $("#js-pagetop");
        $(window).scroll(function () {
          if ($(window).scrollTop() > 100) {
            $pageTop.fadeIn(300).css("display", "flex");
          } else {
            $pageTop.fadeOut(300);
          }
        });
        $pageTop.click(function () {
          $("html, body").animate({ scrollTop: 0 }, 300);
        });

        // highlight.js has no built-in Redis grammar. Register a small one so
        // uppercase Redis commands (the redis-cli convention) get highlighted
        // -- bash's grammar only recognizes its own lowercase keywords.
        hljs.registerLanguage("redis", function (hljs) {
          const KEYWORDS = [
            "GET", "SET", "DEL", "EXISTS", "EXPIRE", "TTL", "PERSIST", "INCR", "DECR",
            "INCRBY", "DECRBY", "APPEND", "STRLEN", "MGET", "MSET", "HGET", "HGETALL",
            "HSET", "HMSET", "HDEL", "HKEYS", "HVALS", "HLEN", "HEXISTS", "LPUSH", "RPUSH",
            "LRANGE", "LPOP", "RPOP", "LLEN", "SADD", "SMEMBERS", "SREM", "SISMEMBER",
            "ZADD", "ZRANGE", "ZSCORE", "ZREM", "KEYS", "SCAN", "TYPE", "PING", "INFO",
            "CONFIG", "FLUSHALL", "FLUSHDB", "SELECT",
          ];
          return {
            case_insensitive: true,
            keywords: { keyword: KEYWORDS.join(" ") },
            contains: [hljs.QUOTE_STRING_MODE, hljs.APOS_STRING_MODE, hljs.C_NUMBER_MODE],
          };
        });

        var renderer = new marked.Renderer();
        renderer.code = (code, language) => {
          if (language === "mermaid") {
            return '<pre class="mermaid">' + escapeHtmlText(code) + "</pre>";
          }
          let value;
          try {
            value =
              language && hljs.getLanguage(language)
                ? hljs.highlight(code, { language, ignoreIllegals: true }).value
                : hljs.highlightAuto(code).value;
          } catch (e) {
            value = hljs.highlightAuto(code).value;
          }
          const planClass = language === "actual-plan" ? ' class="actual-execution-plan"' : "";
          return "<pre" + planClass + "><code>" + value + "</code></pre>";
        };
        renderer.heading = (tokens, depth) => {
          return `<h${depth} class='subtitle is-${depth}'>${tokens}</h${depth}>`;
        };
        renderer.table = (header, body) => {
          return `<table class="table is-bordered is-striped is-narrow is-hoverable is-fullwidth">
            <thead>${header}</thead>
            ${body}
            </table>
            `;
        };
        marked.use({ renderer });

        Object.keys(markdownValues).forEach((it, idx) => {
          try {
            const { lang, s } = markdownValues[it];
            const content = unescapeHtml(s);
            if (lang === "Markup") {
              const md = marked.parse(content);
              $("#" + it).html(md);
            } else {
              const md = marked.parse(` \`\`\`${lang}\n${content}\n\`\`\` `);
              $("#" + it).html(md);
            }
          } catch (e) {
            console.error("at " + idx, e);
          }
        });

        renderMermaidDiagrams();

        // tab click
        $("div.tabs li > a").click(function () {
          const aObj = $(this);
          const clazz = aObj.data("id-class");
          const tab = aObj.data("tab");
          aObj.closest("ul").children("li").removeClass("is-active");
          aObj.parent().addClass("is-active");
          $("div." + clazz).hide();
          $(`#${clazz}-${tab}`).show();
        });
        // chart
        refreshChartColors();
        Object.keys(chartValues).forEach((chartId) => {
          try {
            const content = JSON.parse(unescapeHtml(chartValues[chartId]));
            const ctx = document.getElementById(chartId).getContext("2d");
            reportCharts.push(new Chart(ctx, {
              type: content.type,
              data: content.data,
              options: content.options,
              plugins: [ChartDataLabels],
            }));
          } catch (e) {
            console.error("ERROR chartId[" + chartId + "]", e);
          }
        });

        $("span.delete_icon").click(function () {
          $("input.keyword").val("");
          search();
        });
        // search
        $("input.keyword").on("keyup", function (e) {
          if (e.key === "Enter" || e.keyCode === 13) {
            search();
          }
        });
        $("button.search").click(function () {
          search();
        });
        function search() {
          const keywords = $("input.keyword").val().trim();
          const mode = $("select.mode").val();
          $(`table.table > tbody > tr > td`).removeClass("has-text-link has-background-link-light");
          $(`div.block > span.tag.contains`).remove();

          const matchKeywords = (elmText) => {
            if (mode === "") {
              return elmText.toLocaleLowerCase().includes(keywords.toLocaleLowerCase());
            } else if (mode === "Aa") {
              return elmText.includes(keywords);
            } else if (mode === ".*") {
              return elmText.match(new RegExp(keywords));
            }
            return false;
          };

          if (keywords) {
            for (let i = 0; i < numOfContents; i++) {
              const elmText = $(`div.wrapper.cellIdx${i}`).text();
              if (matchKeywords(elmText)) {
                $(`.cellIdx${i}`).show();
                $(`.cellIdx${i} div.block`).each((idx, el) => {
                  const $el = $(el);
                  const text = $el.text();
                  if (matchKeywords(text)) {
                    $el.append('<span class="tag is-link contains">Contains the keywords!</span>');
                  }
                });
                $(`.cellIdx${i} table.table > tbody > tr > td`).each((idx, el) => {
                  const $el = $(el);
                  const text = $el.text();
                  if (matchKeywords(text)) {
                    $el.addClass("has-text-link has-background-link-light");
                  }
                });
              } else {
                $(`.cellIdx${i}`).hide();
              }
            }
          } else {
            for (let i = 0; i < numOfContents; i++) {
              $(`.cellIdx${i}`).show();
            }
          }
        }
      });
      // -->
    </script>
    <!-- __CUSTOM_SCRIPT__ -->
  </head>
  <body>
